name: Build Misti APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project files
        run: |
          mkdir -p build_dir
          ZIP_FILE=$(ls misti-android-updated*.zip jarvis-android-main*.zip *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d build_dir
          else
            echo "No zip found, copying repository files"
            cp -r . build_dir/jarvis-android-main
          fi
          GRADLE_DIR=$(find build_dir -name "gradlew" -printf "%h\n" | head -n 1)
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Wake Word ONNX models (personal use only)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p app/src/debug/assets/wake
          cd app/src/debug/assets/wake
          B=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fL --retry 3 -o "$f" "$B/$f" || echo "WARNING: could not download $f"
          done
          ls -la

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: misti-${{ github.run_number }}
          name: Misti build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
